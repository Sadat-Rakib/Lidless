name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Lidless.sln --configuration Release --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/Lidless.App/Lidless.App.csproj
          --configuration Release
          -r win-x64
          --self-contained false
          -o artifacts/Lidless

      - uses: actions/upload-artifact@v4
        with:
          name: Lidless-windows-x64
          path: artifacts/Lidless
